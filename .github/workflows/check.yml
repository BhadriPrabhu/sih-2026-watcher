name: SIH 2026 Result Watcher

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows manual "Run workflow" button

permissions:
  contents: write           # Needed to save last_hash.txt back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4 requests

      - name: Run checker
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python check_sih.py

      - name: Commit updated hash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_hash.txt
          git diff --staged --quiet || git commit -m "Update SIH page hash"
          git push
